<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a78d6"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="VetCare">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>VetCare — سجل المبيعات الذكي</title><style>:root{
  color-scheme:light;
  --bg:#f4f4f1;--surface:#fcfcfb;--surface2:#f5f5f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--shadow:0 1px 2px rgba(11,11,11,.04),0 4px 14px rgba(11,11,11,.04);
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;
  --good:#006300;--bad:#d03b3b;--warn:#b57500;--brand:#2a78d6;--brandInk:#fff;--hover:rgba(11,11,11,.045);--overlay:rgba(11,11,11,.42);
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface2:#222220;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--shadow:0 1px 2px rgba(0,0,0,.4);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --good:#0ca30c;--bad:#e66767;--warn:#fab219;--hover:rgba(255,255,255,.06);--overlay:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--surface2:#222220;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--shadow:0 1px 2px rgba(0,0,0,.4);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --good:#0ca30c;--bad:#e66767;--warn:#fab219;--hover:rgba(255,255,255,.06);--overlay:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
bdi.n,.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
svg{display:block;max-width:100%}
svg text{font-family:inherit;direction:ltr}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sh{display:none}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:600;text-align:start}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.side .sp{flex:1}
.bk{font-size:12px;border:1px dashed var(--axis);border-radius:10px;padding:9px 11px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.bk.warn{border-color:var(--warn);color:var(--warn);border-style:solid;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:12px 26px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800;margin-inline-end:auto}
.page{padding:22px 26px 60px;max-width:1500px;width:100%;margin-inline:auto}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);color:var(--brandInk);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;box-shadow:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:36px;height:36px;padding:0;justify-content:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.per{display:flex;align-items:center;gap:4px}
select.sel,input.inp,textarea.inp{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 11px;outline:none;min-width:0}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kpi .lbl{color:var(--ink2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.kpi .val{font-size:29px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-inline-start:4px}
.kpi .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;color:var(--muted);font-size:12.5px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;padding:2px 7px;border-radius:99px}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.delta.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.delta.nt{color:var(--muted);background:var(--hover)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.chart{width:100%;position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ins{display:flex;flex-direction:column;gap:9px}
.insi{display:flex;gap:11px;padding:11px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.insi .b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.insi.good .b{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.insi.warn .b{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.insi.bad .b{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.insi.info .b{background:color-mix(in srgb,var(--c1) 15%,transparent);color:var(--c1)}
.insi b{display:block;font-size:13.5px}
.insi p{color:var(--ink2);font-size:13px}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:110px 1fr 92px;align-items:center;gap:10px;font-size:13px;padding:3px 6px;border-radius:8px;cursor:pointer}
.hbr:hover{background:var(--hover)}
.hbr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbr .tr{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.hbr .fl{height:100%;border-radius:0 5px 5px 0;min-width:3px}
.hbr .vl{text-align:end;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1.25/1;border-radius:10px;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;font-size:12px;position:relative;cursor:pointer;min-height:44px;background:var(--surface2)}
.cal .d:hover{outline:2px solid var(--brand);outline-offset:1px}
.cal .d.emp{border-style:dashed;background:none;color:var(--muted)}
.cal .d.pad{visibility:hidden}
.cal .d b{font-size:12px}
.cal .d small{font-size:10.5px;opacity:.9}
.cal .d .neg-mark{position:absolute;top:6px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 2px var(--surface)}
.cal .d.hi{color:#fff}
.gr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.gr i{display:block;width:120px;height:8px;border-radius:5px;background:linear-gradient(to left,var(--c1),color-mix(in srgb,var(--c1) 8%,var(--surface)))}
.tw{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);max-height:calc(100vh - 210px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--grid);white-space:nowrap;text-align:end}
table.t th{position:sticky;top:0;background:var(--surface2);z-index:2;font-weight:700;color:var(--ink2);font-size:12.5px}
table.t td:first-child,table.t th:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1}
table.t th:first-child{background:var(--surface2);z-index:3}
table.t tbody tr:hover td{background:var(--hover)}
table.t tbody tr:hover td:first-child{background:color-mix(in srgb,var(--surface) 92%,var(--ink))}
table.t tfoot tr:first-child td{bottom:37px}
table.t tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:800;z-index:2}
table.t tr.clk{cursor:pointer}
table.t tr.off td{color:var(--muted)}
table.t td.cell{cursor:cell;min-width:74px}
table.t td.cell input{width:70px;border:0;outline:2px solid var(--brand);border-radius:6px;padding:2px 5px;text-align:end;direction:ltr;background:var(--surface)}
.mini{display:inline-block;width:64px;height:7px;background:var(--surface2);border-radius:5px;overflow:hidden;vertical-align:middle;border:1px solid var(--border)}
.mini i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--hover);color:var(--ink2)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{cursor:pointer;transition:transform .12s,border-color .12s}
.sc:hover{transform:translateY(-2px);border-color:var(--brand)}
.sc .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc .tot{font-size:21px;font-weight:800;margin:4px 0}
.sc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--ink2);margin-top:8px}
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;justify-content:flex-start;animation:fd .15s}
.modal{background:var(--surface);width:min(560px,100%);height:100%;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25);animation:sl .2s ease}
.modal.wide{width:min(700px,100%)}
@keyframes fd{from{opacity:0}}
@keyframes sl{from{transform:translateX(-40px);opacity:0}}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.mh h2{font-size:17px;margin-inline-end:auto}
.mb{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface2)}
.fld label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.fld .inp{width:100%}
.big{font-size:26px!important;font-weight:800;padding:10px 14px!important;direction:ltr;text-align:end}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--c2) 16%,transparent);border-color:var(--c2);color:var(--ink)}
.chip.on::before{content:"✓ "}
.erow{display:grid;grid-template-columns:1fr 130px 30px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--grid)}
.erow .hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.erow .inp{direction:ltr;text-align:end;font-weight:700}
.sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumbar>div{min-width:0;overflow-wrap:anywhere}.sumbar div{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.sumbar small{color:var(--muted);display:block;font-size:12px}
.sumbar b{font-size:18px}
.note{font-size:12.5px;border-radius:10px;padding:8px 11px;background:var(--surface2);color:var(--ink2);border:1px solid var(--border)}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink)}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 11px;border-radius:9px;font-size:12.5px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;line-height:1.6}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:2px}
.tip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px}
.toasts{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir=ltr] .toasts{transform:translateX(-50%)}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;font-weight:600;animation:fd .2s}
.toast button{background:none;border:0;color:var(--c1);font-weight:800;filter:brightness(1.5)}
.pal{position:fixed;inset:0;z-index:110;background:var(--overlay);display:flex;justify-content:center;padding-top:12vh}
.pal>div{width:min(560px,94%);background:var(--surface);border-radius:16px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.35);align-self:flex-start;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:16px 18px;font-size:16px;outline:none;background:none}
.pal ul{list-style:none;padding:6px;max-height:50vh;overflow:auto}
.pal li{padding:9px 12px;border-radius:9px;display:flex;gap:10px;align-items:center;cursor:pointer}
.pal li.on{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.pal li small{margin-inline-start:auto;color:var(--muted)}
.empty{text-align:center;padding:38px 16px;color:var(--ink2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
.sl{width:100%;accent-color:var(--brand)}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sim .r{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:2px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring .ct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .ct b{font-size:26px}
.flex{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rep{max-width:900px;margin:auto}
.rep h2{font-size:22px}
hr.h{border:0;border-top:1px solid var(--border);margin:14px 0}
.drop{border:2px dashed var(--axis);border-radius:14px;padding:26px;text-align:center;color:var(--ink2);cursor:pointer}
.drop:hover,.drop.ov{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,transparent)}
.hov .hl{opacity:0}.hov:hover .hl{opacity:1}
.hov{cursor:crosshair}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c1) 9%,transparent);border:1px solid color-mix(in srgb,var(--c1) 30%,transparent);margin-bottom:16px;flex-wrap:wrap}
.hide-sm{}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .kpi .val{font-size:21px}.top h1{font-size:16px}.card{padding:14px}.top .per{order:5;width:100%}.top .per select{flex:1}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:40;border-inline-end:0;border-top:1px solid var(--border);gap:0}
  .brand,.side .sp,.bk{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around;overflow-x:auto;scrollbar-width:none;min-width:0}.nav::-webkit-scrollbar{display:none}
  .nav button{flex-direction:column;gap:2px;padding:6px 6px;font-size:10.5px;flex:1 0 auto;min-width:0;align-items:center;text-align:center;white-space:nowrap}
  .nav .lg{display:none}.nav .sh{display:inline}
  .rep{overflow-x:auto}.rep .t th{white-space:normal}
  .card .btn,.note .btn{white-space:normal;text-align:start;line-height:1.45;min-width:0;max-width:100%}
  .top{padding:10px 14px}.page{padding:14px 14px 96px}
  .hide-sm{display:none!important}
  .sim{grid-template-columns:1fr}
  .hbr{grid-template-columns:84px 1fr 80px}
}
@media(max-width:400px){.nav button{padding:6px 2px;font-size:9.5px}}
@media print{
  .side,.top,.noprint,.toasts,.modal-bg{display:none!important}
  .app{display:block}.page{padding:0;max-width:none}
  body{background:#fff;--surface:#fff;--surface2:#f5f5f2;--ink:#000;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  .tw{max-height:none;overflow:visible}
}
@media (max-width:820px){.cal{gap:3px}.cal .d{padding:3px 4px;min-height:40px;border-radius:7px}.cal .d small{font-size:9px}.cal .wd{font-size:9.5px}.cal .d .neg-mark{width:6px;height:6px;top:4px}}

html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,[data-act]{touch-action:manipulation}
@media (max-width:820px){
  input,select,textarea{font-size:16px!important}
  .side{padding-bottom:max(6px,env(safe-area-inset-bottom));padding-inline:max(6px,env(safe-area-inset-left))}
  .page{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .modal{width:100%!important}
  .mf{padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .btn{min-height:40px}.btn.sm{min-height:34px}

  while(y<ey||(y===ey&&m<=em)){out.push([y,m]);m++;if(m>12){m=1;y++}}
  return out;
}

/* ====================== التحليل والتوقع ====================== */
function dowStats(rs){
  const o={};for(let d=0;d<7;d++)o[d]={n:0,inc:0,exp:0};
  rs.forEach(r=>{const x=o[r.dow];x.n++;x.inc+=r.inc;x.exp+=r.exp});
  for(let d=0;d<7;d++){o[d].avgInc=o[d].n?o[d].inc/o[d].n:0;o[d].avgExp=o[d].n?o[d].exp/o[d].n:0}
  return o;
}
function confidence(rs){
  const n=rs.length,months=new Set(rs.map(r=>ymOf(r.k))).size;
  if(n<14)return {lvl:0,txt:T("ضعيفة جدًا"),why:`${T("لسه")} ${n} ${T("يوم بس مسجل")}`};
  if(months<2)return {lvl:1,txt:T("أولية"),why:`${T("بيانات شهر واحد فقط (")}${n} ${T("يوم) — بتحسن مع كل شهر جديد")}`};
  if(months<4)return {lvl:2,txt:T("متوسطة"),why:`${months} ${T("شهور من البيانات")}`};
  if(months<12)return {lvl:3,txt:T("جيدة"),why:`${months} ${T("شهور من البيانات")}`};
  return {lvl:4,txt:T("عالية"),why:`${months} ${T("شهر من البيانات — كفاية لمراعاة الموسمية")}`};
}
/* توقع أيام من startKey إلى endKey اعتمادًا على آخر ≤ 60 يوم مسجل */
const addYear=(k,n)=>{const d=parseKey(k);d.setFullYear(d.getFullYear()+n);return key(d)};
function forecastRange(startKey,endKey){
  const histAll=RECS.filter(r=>r.k<startKey),hist=histAll.slice(-60);
  if(hist.length<7)return null;
  const level0=mean(hist.map(r=>r.inc));const ds=dowStats(hist);const K=2;
  const f={};for(let d=0;d<7;d++){const x=ds[d];f[d]=level0?((x.n*x.avgInc+K*level0)/(x.n+K))/level0:1}
  const ratio=sum(hist.map(r=>r.exp))/Math.max(1,sum(hist.map(r=>r.inc)));
  const res=hist.map(r=>r.inc-level0*f[r.dow]);const sI=std(res);
  const sE=std(hist.map(r=>r.exp));
  let days=0;for(let k=startKey;k<=endKey;k=addDays(k,1))days++;
  // موسمية: نسبة أداء نفس الفترة المستهدفة إلى فترة المقارنة في السنة اللي فاتت
  let seas=1,seasUsed=false;
  if(hist.length>=30){
    const inYear=(a,b)=>RECS.filter(r=>r.k>=addYear(a,-1)&&r.k<=addYear(b,-1));
    const win=inYear(hist[0].k,hist[hist.length-1].k),tgt=inYear(startKey,endKey);
    if(win.length>=20&&tgt.length>=Math.min(15,Math.ceil(days*.5))){
      const a0=mean(win.map(r=>r.inc)),a1=mean(tgt.map(r=>r.inc));
      if(a0>0){seas=Math.min(1.6,Math.max(.6,a1/a0));seasUsed=true}
    }
  }
  const level=level0*seas;let inc=0;
  for(let k=startKey;k<=endKey;k=addDays(k,1))inc+=level*f[parseKey(k).getDay()];
  const exp=inc*ratio,net=inc-exp;
  const bi=1.28*sI*Math.sqrt(days),be=1.28*sE*Math.sqrt(days);
  return {days,inc,exp,net,incLo:inc-bi,incHi:inc+bi,netLo:net-Math.sqrt(bi*bi+be*be),netHi:net+Math.sqrt(bi*bi+be*be),ratio,level,seas,seasUsed,conf:confidence(histAll)};
}
/* إيقاع الدفع لكل شركة → الدفعة المتوقعة */
let PRC={},CL=null;
function catLists(){if(CL)return CL;CL={};RECS.forEach(r=>{for(const c in r.e)(CL[c]||(CL[c]=[])).push([r.k,r.e[c]])});return CL}
function payRhythm(catId){
  if(PRC[catId])return PRC[catId];
  return PRC[catId]=payRhythm0(catId);
}
function payRhythm0(catId){
  const list=catLists()[catId]||[];
  if(list.length<2)return {n:list.length,list};
  const gaps=[];for(let i=1;i<list.length;i++)gaps.push(diffDays(list[i-1][0],list[i][0]));
  const gap=median(gaps),last=list[list.length-1];
  return {n:list.length,list,gap,typ:median(list.map(x=>x[1])),last:last[0],next:addDays(last[0],Math.max(1,Math.round(gap)))};
}
const refDate=()=>RECS.length?RECS[RECS.length-1].k:todayKey();

/* ====================== الملاحظات الذكية ====================== */
function buildInsights(pi){
  const rs=pi.recs,a=pi.a,out=[];const add=(t,ico,title,text,pr=5)=>out.push({t,ico,title,text,pr});
  if(!rs.length)return out;
  const byInc=[...rs].sort((x,y)=>y.inc-x.inc),byNet=[...rs].sort((x,y)=>y.net-x.net);
  // 1 الصافي
  const mg=a.margin;
  add(mg>=.25?'good':mg>=.1?'info':'warn',mg>=.25?'up':'info',T("صافي الفترة"),
    `${T("دخل")} ${M(a.inc)} ${T("ودفعت")} ${M(a.exp)}${T("، يعني الفاضل")} ${M(a.net)} (${P(mg)} ${T("من الإيراد).")} ${mg>=.25?T("نسبة كويسة."):mg>=.1?T("نسبة معقولة."):T("نسبة ضعيفة — راجع المدفوعات.")} <span class="muted">${T("(ده صافي نقدي: الإيراد − اللي اتدفع، مش ربح محاسبي، لأن دفعات الشركات ممكن تكون عن بضاعة لسه في الرف.)")}</span>`,9);
  // 2 أفضل وأضعف يوم
  const best=byInc[0],worst=byInc.filter(r=>r.inc>0).slice(-1)[0];
  add('info','up',`${T("أعلى يوم بيع:")} ${dShort(best.k)}`,`${AR_D[best.dow]} ${dShort(best.k)} ${T("بإيراد")} ${M(best.inc)}${T("، أعلى من متوسط اليوم (")}${M(a.avgInc)}${T(") بـ")} ${P(best.inc/a.avgInc-1,0)}.`+(worst&&worst.k!==best.k?` ${T("وأضعف يوم فيه بيع كان")} ${dShort(worst.k)} ${T("بـ")} ${M(worst.inc)}.`:''),6);
  // 3 أيام الإغلاق
  const zero=rs.filter(r=>r.inc===0);
  if(zero.length)add('info','clock',`${zero.length} ${Dn(zero.length,zero.length>2?"أيام":"يوم")} ${T("بدون مبيعات")}`,`${zero.map(r=>dShort(r.k)+' ('+AR_D[r.dow]+')').join((T("،")+' '))}${T(". لو دي أجازات مفيش مشكلة، وإلا فالمعدل ده بيقلل متوسط اليوم.")}`,3);
  // 4 يوم الأسبوع
  const ds=dowStats(rs.filter(r=>r.inc>0)),ok=Object.keys(ds).filter(d=>ds[d].n>=2);
  if(ok.length>=5){
    const s=[...ok].sort((x,y)=>ds[y].avgInc-ds[x].avgInc);const hi=s[0],lo=s[s.length-1];
    add('info','cal',`${T("أقوى يوم في الأسبوع:")} ${AR_D[hi]}`,`${T("متوسط بيع")} ${AR_D[hi]} ${M(ds[hi].avgInc)} ${T("مقابل")} ${M(ds[lo].avgInc)} ${LANG==="en"?"on":T("يوم")} ${AR_D[lo]} ${T("(فرق")} ${P(ds[hi].avgInc/Math.max(1,ds[lo].avgInc)-1,0)}). ${a.n<40?('<span class='+'"'+'muted'+'"'+'>'+T("العينة صغيرة — خد الكلام كمؤشر مش قاعدة.")+'</span>'):''}`,5);
  }
  // 5 تركيز الموردين
  const sups=Object.entries(a.byCat).filter(([c])=>CM[c]&&CM[c].type==='sup').sort((x,y)=>y[1].t-x[1].t);
  if(sups.length>=3&&a.sup>0){
    const t3=sum(sups.slice(0,3).map(x=>x[1].t))/a.sup;
    add(t3>.6?'warn':'info','truck',`${T("أكبر 3 شركات =")} ${pctTxt(t3,0)} ${T("من المشتريات")}`,
      `${sups.slice(0,3).map(([c,b])=>esc(CM[c].name)+' ('+pctTxt(b.t/a.sup,0)+')').join((T("،")+' '))}. ${t3>.6?T("اعتمادك عليهم كبير — لو حد فيهم اتأخر أو غلّى، الأثر هيبان فورًا. فكّر في بديل أو تفاوض على شروط دفع."):T("توزيع صحي نسبيًا.")}`,t3>.6?8:4);
  }
  // 6 أيام العجز
  const neg=rs.filter(r=>r.net<0);
  if(neg.length){const w=[...neg].sort((x,y)=>x.net-y.net)[0];
    add(neg.length/rs.length>.4?'warn':'info','warn',`${neg.length} ${T("يوم المدفوعات فيهم أكبر من الإيراد")}`,`${pctTxt(neg.length/rs.length,0)} ${T("من الأيام. أسوأ يوم")} ${dShort(w.k)} ${T("بعجز")} ${M(-w.net)}${(()=>{const top=Object.entries(w.e).sort((x,y)=>y[1]-x[1])[0];return top?` ${T("(أكبر دفعة:")} ${esc(CM[top[0]]?.name||'')} ${M(top[1])})`:''})()}${T(". الأيام دي غالبًا يوم سداد شركة كبيرة — الأهم إن الشهر ككل موجب. لو عايز تخفف الضغط وزّع الدفعات على أيام أقوى في البيع.")}`,neg.length/rs.length>.4?8:4)}
  // 7 نقطة التعادل اليومية
  if(a.n>=7){const be=a.avgExp,abv=rs.filter(r=>r.inc>=be).length;
    add(abv/rs.length>=.5?'good':'warn','target',T("حد التعادل اليومي"),`${T("متوسط مدفوعاتك اليومي")} ${M(be)}${T("؛ يعني لازم البيع اليومي يفضل فوق كده. حققته في")} ${abv} ${T("يوم من")} ${rs.length} (${pctTxt(abv/rs.length,0)}).`,5)}
  // 8 مصروفات التشغيل
  if(a.op>0)add('info','info',`${T("التشغيل")} ${pctTxt(a.op/a.inc,1)} ${T("من الإيراد")}`,`${T("مصروفات التشغيل (مرتبات، كهرباء، أكياس…)")} ${M(a.op)}. ${(()=>{const t=Object.entries(a.byCat).filter(([c])=>CM[c]&&CM[c].type==='op').sort((x,y)=>y[1].t-x[1].t)[0];return t?`${T("أكبر بند:")} ${esc(CM[t[0]].name)} ${M(t[1].t)}.`:''})()}`,3);
  // 9 شواذ
  if(rs.length>=10){const mi=mean(rs.map(r=>r.inc)),si=std(rs.map(r=>r.inc)),me=mean(rs.map(r=>r.exp)),se=std(rs.map(r=>r.exp));
    const oi=rs.filter(r=>si&&r.inc>0&&Math.abs(r.inc-mi)>2*si),oe=rs.filter(r=>se&&r.exp-me>2*se);
    if(oi.length||oe.length)add('warn','warn',T("أرقام تستاهل مراجعة"),[oi.length?`${T("إيراد غير معتاد في")} ${oi.map(r=>dShort(r.k)).join((T("،")+' '))}`:'',oe.length?`${T("مدفوعات عالية جدًا في")} ${oe.map(r=>dShort(r.k)).join((T("،")+' '))}`:''].filter(Boolean).join(' — ')+T(". لو الأرقام صح تمام، لو فيه غلطة إدخال صحّحها."),6)}
  // 10 شركات متأخرة عن ميعادها
  const ref=refDate(),late=[];
  DB.cats.filter(c=>c.on&&c.type==='sup').forEach(c=>{const r=payRhythm(c.id);if(r.n>=3&&r.gap>0){const since=diffDays(r.last,ref);if(since>r.gap*DB.settings.overdue)late.push({c,since,gap:r.gap,typ:r.typ})}});
  if(late.length)add('warn','clock',`${late.length} ${T("شركة عدّى ميعاد دفعها المعتاد")}`,late.slice(0,4).map(x=>`${esc(x.c.name)} ${T("(بتاخد دفعة كل ~")}${Math.round(x.gap)} ${T("يوم، آخر دفعة من")} ${x.since} ${T("يوم)")}`).join((T("،")+' '))+T(". ممكن يكون في مستحقات متراكمة."),7);
  // 11 مقارنة بالفترة السابقة
  if(pi.prev&&rs.length>=5){const pp=periodInfo(pi.prev);if(pp.recs.length>=5){const d=a.avgInc/pp.a.avgInc-1;
    add(d>=0?'good':'warn',d>=0?'up':'down',`${T("المبيعات")} ${d>=0?T("أعلى"):T("أقل")} ${T("من")} ${pp.label}`,`${T("متوسط البيع اليومي")} ${M(a.avgInc)} ${T("مقابل")} ${M(pp.a.avgInc)} (${d>=0?'+':''}${pctTxt(d,1)}).`,7)}}
  if(pi.p.mode==='month'&&rs.length>=5){
    const ly=RECS.filter(r=>ymOf(r.k)===`${pi.p.y-1}-${pad(pi.p.m)}`);
    if(ly.length>=10){const g=agg(ly),d=a.avgInc/g.avgInc-1;
      add(d>=0?'good':'warn',d>=0?'up':'down',`${cap(d>=0?T("أعلى"):T("أقل"))} ${T("من نفس الشهر السنة اللي فاتت")}`,`${T("متوسط البيع اليومي")} ${M(a.avgInc)} ${T("مقابل")} ${M(g.avgInc)} ${T("في")} ${mLabel(pi.p.y-1,pi.p.m)} (${d>=0?'+':''}${pctTxt(d,1)}${T("). المقارنة بنفس الشهر بتشيل أثر المواسم.")}`,7)}
  }
  return out.sort((x,y)=>y.pr-x.pr);
}

/* ====================== طبقة البيئة (Platform) ======================
   كل حاجة تخص Electron أو متصفح معيّن لازم تبقى هنا بس.

};
if(ENV.electron)document.documentElement.classList.add('electron');
const PLAT={

/* ====================== التخزين والحماية ====================== */
let LOAD_ERR=null,FIRST_RUN=false,LAST_REP=null;
const isRealKey=k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&key(parseKey(k))===k;
function sanitize(d){
  const rep={fixed:0,dropped:0,unknownCats:0};
  if(!d||typeof d!=='object')d={};
  d=migrate(d);
  if(!Array.isArray(d.cats))d.cats=[];
  d.days=d.days&&typeof d.days==='object'?d.days:{};
  d.settings=Object.assign({},DEF_SET,d.settings||{});
  const ids=new Set();
  d.cats=d.cats.filter(c=>c&&c.id!=null&&c.name&&!ids.has(String(c.id))&&ids.add(String(c.id))).map(c=>({id:String(c.id),name:String(c.name),type:c.type==='op'?'op':'sup',on:c.on===0||c.on===false?0:1}));
  const days={};
  for(const k of Object.keys(d.days)){
    if(!isRealKey(k)){rep.dropped++;continue}
    const x=d.days[k]||{};let i=+x.i;if(!isFinite(i)){i=0;rep.fixed++}
    const e={};
    for(const c in (x.e||{})){
      const v=+x.e[c];if(!isFinite(v)||v<=0){rep.fixed++;continue}
      if(!ids.has(c)){d.cats.push({id:c,name:'بند غير معروف ('+c+')',type:'sup',on:0});ids.add(c);rep.unknownCats++}
      e[c]=v}
    days[k]={i,e};if(x.n)days[k].n=String(x.n);
    if(x.p&&typeof x.p==='object'){const p={};for(const c in x.p){if(!e[c]||!Array.isArray(x.p[c]))continue;const a=x.p[c].filter(s=>typeof s==='string'&&/^[\w-]{4,40}$/.test(s));if(a.length)p[c]=a}if(Object.keys(p).length)days[k].p=p}
  }
  d.days=days;d.v=SCHEMA;LAST_REP=rep;return d;
}
/* ---------- حالة الحفظ (P0): مفيش رسالة نجاح كاذبة، ولا مسح للقديم لو الحفظ فشل ---------- */
const SCHEMA=2,REVK=LS+'_rev';
let MYREV=0,FALLBACK=false,auxT=null;
const SAVE={ls:true,idb:true,err:'',conflict:false,dirty:false,readonly:false,idbErr:''};
const MIGR={/* إصدار قديم → أحدث: 1:d=>{...;return d} — بتتنفذ بالترتيب على البيانات القديمة */};
function readRev(){try{return +localStorage.getItem(REVK)||0}catch(e){return 0}}
function migrate(d){
  let v=+d.v||1;
  while(v<SCHEMA){if(MIGR[v])d=MIGR[v](d)||d;v++}
  d.v=SCHEMA;return d;
}
function loadDB(){
  let raw=null;
  try{raw=localStorage.getItem(LS);localStorage.setItem(LS+'_probe','1');localStorage.removeItem(LS+'_probe')}
  catch(e){STORE_OK=false;SAVE.ls=false;SAVE.err=(e&&e.name==='QuotaExceededError')?'quota':'unavailable'}
  MYREV=readRev();
  if(raw){
    try{const j=JSON.parse(raw);
      if(j&&+j.v>SCHEMA){SAVE.readonly=true;LOAD_ERR='newer';DB=sanitize(JSON.parse(JSON.stringify(j)));return}
      DB=sanitize(j);return}
    catch(e){try{localStorage.setItem(LS+'_corrupt',raw)}catch(_){}LOAD_ERR='corrupt'}}
  let raw2=null;try{raw2=localStorage.getItem(LS+'_prev')}catch(e){}
  if(raw2){try{DB=sanitize(JSON.parse(raw2));LOAD_ERR=LOAD_ERR||'recovered';persist();return}catch(e){}}
  FIRST_RUN=!raw;FALLBACK=true;DB=sanitize(JSON.parse(JSON.stringify(SEED)));persist();
}
/* بيرجّع true لو الحفظ اتأكد فعلًا (كتابة + قراءة مرة تانية). أي فشل بيظهر شريط تحذير دائم */
function persist(){
  if(SAVE.readonly){updateSaveBar();return false}
  if(SAVE.conflict){SAVE.dirty=true;updateSaveBar();return false}
  let ok=false,err='';
  try{
    const cur=readRev();
    if(cur>MYREV){SAVE.dirty=true;onConflict();return false}
    const nw=JSON.stringify(DB);let old=null;
    try{old=localStorage.getItem(LS)}catch(_){}
    const write=()=>{if(old&&old!==nw){try{localStorage.setItem(LS+'_prev',old)}catch(_){}}localStorage.setItem(LS,nw)};
    try{write()}catch(e){
      if(e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014)){ // نضّف النسخ الجانبية وحاول مرة واحدة
        try{localStorage.removeItem(LS+'_corrupt');localStorage.removeItem(LS+'_prev')}catch(_){}
        write()}else throw e}
    if(localStorage.getItem(LS)!==nw)throw new Error('verify');
    MYREV=cur+1;try{localStorage.setItem(REVK,String(MYREV))}catch(_){}
    ok=true;
  }catch(e){err=(e&&(e.name==='QuotaExceededError'||e.code===22))?'quota':'error'}
  STORE_OK=ok;SAVE.ls=ok;SAVE.err=ok?'':err;SAVE.dirty=!ok;
  clearTimeout(auxT);auxT=setTimeout(aux,ok?900:0);
  updateSaveBar();return ok;
}
/* شريط التحذير الدائم */
function updateSaveBar(){
  let el=document.getElementById('savebar');
  const bad=SAVE.readonly||(!SAVE.ls&&(SAVE.dirty||SAVE.err));
  if(!bad){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='savebar';el.setAttribute('role','alert');document.body.appendChild(el)}
  let msg,sev='crit';
  if(SAVE.readonly){msg=T("⚠️ البيانات دي اتحفظت بنسخة أحدث من البرنامج. النسخة دي للعرض فقط ومش هتحفظ أي تعديل — حدّث البرنامج.")}
  else if(SAVE.idb&&!SAVE.idbErr&&SAVE.mirrorOk){sev='warn';msg=T("⚠️ تخزين المتصفح الأساسي فشل")+(SAVE.err==='quota'?(' '+T("(المساحة ممتلئة)")):'')+T(". آخر تعديل محفوظ في نسخة احتياطية داخلية فقط. خد نسخة احتياطية الآن.")}
  else msg=T("⚠️ تعذر حفظ آخر تعديل")+(SAVE.err==='quota'?(' '+T("(مساحة التخزين ممتلئة)")):SAVE.err==='unavailable'?(' '+T("(التخزين غير متاح في المتصفح ده — يمكن تصفح خاص)")):'')+T(". لا تغلق البرنامج قبل حل المشكلة.");
  el.className='savebar '+sev;
  el.innerHTML=`<span>${msg}</span>${SAVE.readonly?'':('<button data-act='+'"'+'saveretry'+'"'+'>'+T("إعادة المحاولة")+'</button>'+'<button data-act='+'"'+'backup'+'"'+'>'+T("نسخة احتياطية الآن")+'</button>')}`;

/* ---------- IndexedDB: نسخ تلقائية + مقبض الملف ---------- */
const IDB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{
    try{const r=indexedDB.open('vetcare_sales',2);
      r.onupgradeneeded=()=>{const d=r.result,n=d.objectStoreNames;if(!n.contains('kv'))d.createObjectStore('kv');if(!n.contains('snaps'))d.createObjectStore('snaps',{keyPath:'id'});if(!n.contains('photos'))d.createObjectStore('photos',{keyPath:'id'})};
      r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{this.db.close();this.db=null};res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async tx(store,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})},
  get(store,k){return this.tx(store,'readonly',s=>s.get(k))},
  put(store,v,k){return this.tx(store,'readwrite',s=>k===undefined?s.put(v):s.put(v,k))},
  del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},
  all(store){return this.tx(store,'readonly',s=>s.getAll())}
};

/* ---------- فحص سلامة البيانات ---------- */
function healthCheck(){
  const out=[],rs=RECS;const push=(t,txt,keys)=>out.push({t,txt,keys:keys||[]});
  const inc0=rs.filter(r=>r.inc===0&&r.exp>0).map(r=>r.k);
  if(inc0.length)push('warn',`${inc0.length} ${T("يوم فيه مدفوعات بدون إيراد (ممكن الإيراد لسه ما اتسجلش)")}`,inc0);
  const fut=rs.filter(r=>r.k>addDays(todayKey(),1)).map(r=>r.k);
  if(fut.length)push('warn',`${fut.length} ${T("يوم بتاريخ في المستقبل")}`,fut);
  const incs=rs.map(r=>r.inc).filter(v=>v>0),mi=median(incs);
  const big=rs.filter(r=>mi&&r.inc>mi*6).map(r=>r.k);
  if(big.length)push('warn',`${big.length} ${T("يوم إيراده أكبر من 6 أضعاف المعتاد — ممكن رقم إجمالي متسجل بالغلط")}`,big);
  const neg=rs.filter(r=>r.inc<0).map(r=>r.k);
  if(neg.length)push('warn',`${neg.length} ${T("يوم بإيراد سالب (مرتجعات؟)")}`,neg);
  const names={};DB.cats.forEach(c=>{const n=norm(c.name);(names[n]=names[n]||[]).push(c)});
  const dup=Object.values(names).filter(a=>a.length>1);
  if(dup.length)push('warn',`${T("أسماء شركات مكررة:")} ${dup.map(a=>esc(a[0].name)).join((T("،")+' '))} ${T("— ادمجهم من صفحة الشركة")}`);
  const unk=DB.cats.filter(c=>c.name.startsWith('بند غير معروف'));
  if(unk.length)push('warn',`${unk.length} ${T("بند غير معروف (اتعمل تلقائيًا لدفعات كان اسمها ضايع) — سمّيه أو ادمجه")}`);
  if(rs.length>1){const miss=[];for(let k=rs[0].k;k<rs[rs.length-1].k;k=addDays(k,1))if(!RM[k])miss.push(k);
    if(miss.length)push('info',`${miss.length} ${T("يوم ناقص بين أول وآخر يوم مسجل")}`,miss.slice(0,60))}
  if(LAST_REP&&(LAST_REP.fixed||LAST_REP.dropped))push('info',`${T("عند فتح البرنامج تم تنظيف")} ${LAST_REP.fixed+LAST_REP.dropped} ${T("قيمة غير صالحة")}`);
  if(!out.length)push('good',T("كل حاجة سليمة ✔ — مفيش مشاكل في البيانات"));
  return out;
}

/* ====================== فحص سلامة النسخ الاحتياطية (بيقرأ بس، مبيعدّلش أي بيانات) ====================== */
function checkBackup(j){
  const R={ok:true,errors:[],warnings:[],info:[],days:0,cats:0,payments:0,refs:0,missing:0,photos:0,full:false,version:null};
  const err=t=>{R.ok=false;R.errors.push(t)},warn=t=>R.warnings.push(t);
  if(!j||typeof j!=='object'||Array.isArray(j)){err(T("الملف مش بصيغة نسخة احتياطية (JSON غير صالح)"));return R}
  let d=j,ph=null;
  if(j.vetcare!==undefined){
    R.full=true;R.version=j.vetcare;
    if(!(+j.vetcare>=1&&+j.vetcare<=3))err(T("نسخة الملف مش معروفة (")+j.vetcare+T(") — ممكن يكون من برنامج أحدث"));
    d=j.db;ph=j.photos&&typeof j.photos==='object'?j.photos:{};
    if(!d||typeof d!=='object'){err(T("النسخة الكاملة مفيهاش قسم البيانات (db)"));return R}
  }
  const v=d.v===undefined?1:+d.v;
  if(!isFinite(v))err(T("رقم إصدار البيانات غير صالح"));
  else if(v>SCHEMA)err(`${T("البيانات بإصدار (")}${v}${T(") أحدث من إصدار البرنامج (")}${SCHEMA}${T(") — حدّث البرنامج الأول")}`);
  else if(v<SCHEMA)R.info.push(`${T("بيانات بإصدار أقدم (")}${v}${T(") — هتتحدّث تلقائيًا عند الاسترجاع")}`);
  if(!Array.isArray(d.cats))err(T("قائمة الشركات (cats) ناقصة أو غير صالحة"));
  if(!d.days||typeof d.days!=='object'||Array.isArray(d.days))err(T("قائمة الأيام (days) ناقصة أو غير صالحة"));
  if(!R.ok)return R;
  const ids=new Set();let badCat=0,dupCat=0;
  for(const c of d.cats){
    if(!c||c.id==null||c.id===''||!c.name||typeof c.name!=='string'){badCat++;continue}
    const id=String(c.id);if(ids.has(id)){dupCat++;continue}ids.add(id);
    if(c.type!=='sup'&&c.type!=='op')warn(`${T("الشركة \"")}${c.name}${T("\" نوعها غير معروف (هتتحول لمورد)")}`)}
  R.cats=ids.size;
  if(badCat)err(`${badCat} ${T("شركة/بند بدون اسم أو رقم صالح")}`);
  if(dupCat)err(`${dupCat} ${T("شركة مكررة بنفس الرقم (ID)")}`);
  const used=new Set();let badDate=0,badInc=0,badAmt=0,unk=0,fut=0,pbad=0,pnoexp=0,light=0;
  const today=todayKey();
  for(const k of Object.keys(d.days)){
    if(!isRealKey(k)){badDate++;continue}
    R.days++;const x=d.days[k];
    if(!x||typeof x!=='object'){badInc++;continue}
    if(x.i!==undefined&&!isFinite(+x.i))badInc++;
    if(k>addDays(today,1))fut++;
    if(x.e&&typeof x.e==='object')for(const c in x.e){
      const a=+x.e[c];if(!isFinite(a)||a<=0){badAmt++;continue}R.payments++;if(!ids.has(c))unk++}
    else if(x.e!==undefined&&x.e!==null)badAmt++;
    if(x.p&&typeof x.p==='object')for(const c in x.p){
      if(!Array.isArray(x.p[c])){pbad++;continue}
      if(!(x.e&&+x.e[c]>0))pnoexp++;
      for(const id of x.p[c]){
        if(typeof id!=='string'||!/^[\w-]{4,40}$/.test(id)){pbad++;continue}
        R.refs++;used.add(id);
        if(R.full){if(!(id in ph)){R.missing++}}else light++}}
  }
  if(badDate)warn(`${badDate} ${T("يوم بتاريخ غير صالح (هيتتجاهل عند الاسترجاع)")}`);
  if(badInc)warn(`${badInc} ${T("يوم بإيراد غير صالح (هيتحول لصفر)")}`);
  if(badAmt)warn(`${badAmt} ${T("دفعة بمبلغ غير صالح (هتتجاهل)")}`);
  if(unk)warn(`${unk} ${T("دفعة لشركة غير موجودة في القائمة (هتتعمل لها بند \"غير معروف\")")}`);
  if(fut)warn(`${fut} ${T("يوم بتاريخ في المستقبل")}`);
  if(pbad)warn(`${pbad} ${T("مرجع مرفق غير صالح (هيتتجاهل)")}`);
  if(pnoexp)warn(`${pnoexp} ${T("مرفق مربوط بدفعة مش موجودة")}`);
  if(R.full){
    R.photos=Object.keys(ph).length;
    let corrupt=0;for(const id in ph){const p=ph[id];
      if(id[0]==='f'){if(!p||typeof p.d!=='string'||p.d.indexOf('data:')!==0)corrupt++}
      else if(typeof p!=='string'||p.indexOf('data:image')!==0)corrupt++}
    if(corrupt)err(`${corrupt} ${T("مرفق تالف داخل الملف")}`);
    if(R.missing)err(`${R.missing} ${T("مرفق مذكور في البيانات لكن مش موجود في الملف — النسخة ناقصة")}`);
    const orphan=Object.keys(ph).filter(id=>!used.has(id)).length;
    if(orphan)R.info.push(`${orphan} ${T("مرفق في الملف مش مربوط بأي دفعة")}`);
  }else if(light)warn(`${T("النسخة دي \"بيانات فقط\": فيها")} ${light} ${T("مرجع لمرفقات بس المرفقات نفسها مش جواها. الاسترجاع على جهاز تاني هيطلع المرفقات مفقودة")}`);
  return R;
}

/* ====================== مرفقات الدفعات (صور فواتير + ملفات) ====================== */
/* الصور بتتخزن في IndexedDB (مش جوه بيانات المبيعات) بعد ضغطها، والدفعة بتشاور عليها بالـ id: DB.days[k].p[catId]=[id,...] */
const PH={
  MAX:1400,Q:0.68,TH:180,FMAX:12*1048576,
  newId(f){return (f?'f':'p')+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
  isFile(id){return id[0]==='f'},TK:id=>id+'.t',
  tsOf(id){return parseInt(id.slice(1,9),36)||0},
  load(file){return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(T("الصورة دي مش مدعومة")))};im.src=u})},
  shrink(im,max,q){
    const w0=im.naturalWidth||im.width,h0=im.naturalHeight||im.height,r=Math.min(1,max/Math.max(w0,h0));
    const w=Math.max(1,Math.round(w0*r)),h=Math.max(1,Math.round(h0*r)),c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
    const s=c.toDataURL('image/jpeg',q);if(!s||s.length<100)throw new Error(T("تعذر معالجة الصورة"));return s},
  readURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error(T("تعذر قراءة الملف")));r.readAsDataURL(file)})},
  async add(file){
    const isImg=(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(file.name||'');
    if(isImg){
      try{const im=await PH.load(file),id=PH.newId();
        const full=PH.shrink(im,PH.MAX,PH.Q),th=PH.shrink(im,PH.TH,0.7);
        await IDB.put('photos',{id,data:full});await IDB.put('photos',{id:PH.TK(id),data:th});
        PH.cache.set(PH.TK(id),th);return id}
      catch(e){/* صورة الجهاز مش قادر يعرضها (HEIC مثلًا): نحفظها كما هي كمرفق */}
    }
    if(file.size>PH.FMAX)throw new Error((T("الملف أكبر من")+' ')+(PH.FMAX/1048576)+(' '+T("ميجا")));
    const id=PH.newId(true),data=await PH.readURL(file);
    await IDB.put('photos',{id,data,name:file.name||T("ملف"),type:file.type||'',size:file.size||0});return id;
  },
  cache:new Map(),
  async get(id,thumb){
    const k=thumb?PH.TK(id):id;if(thumb&&PH.cache.has(k))return PH.cache.get(k);
    try{const r=await IDB.get('photos',k);if(!r)return null;if(thumb)PH.cache.set(k,r.data);return r.data}catch(e){return null}
  },

  mc:new Map(),

async function deliver(name,blob){
  {const r=await PLAT.saveFile(name,blob);if(r!==null)return r}
  try{const f=new File([blob],name,{type:blob.type});
    if(IS_IOS&&IS_STANDALONE()&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  download(name,blob);return true;
}
async function backupFull(){
  toast(T("جاري تجهيز النسخة الكاملة…"));
  try{const ids=[...PH.used()],parts=['{"vetcare":3,"db":',JSON.stringify(DB),',"photos":{'];let n=0,miss=0;
    for(const id of ids){const r=await IDB.get('photos',id).catch(()=>null);if(!r||!r.data){miss++;continue}
      const v=PH.isFile(id)?{d:r.data,n:r.name,t:r.type,s:r.size}:r.data;
      parts.push((n++?',':'')+JSON.stringify(id)+':'+JSON.stringify(v))}
    parts.push('}}');
    const blob=new Blob(parts,{type:'application/json'});
    /* تحقق من الملف الناتج قبل ما نعتبره نسخة ناجحة */
    let R=null;if(blob.size<80*1048576){try{R=checkBackup(JSON.parse(await blob.text()))}catch(e){throw new Error(T("الملف الناتج غير صالح — النسخة لم تُحفظ"))}

    if(miss&&!confirm(`⚠️ ${miss} ${T("مرفق مربوط بدفعات لكنه مش موجود على الجهاز ده، فالنسخة هتبقى ناقصة.\nمش هتتحسب كنسخة احتياطية ناجحة.\nتحفظ الملف الناقص على أي حال؟")}`))return;

function niceScale(min,max,n=4){
  if(min===max){max=min+1}
  const step0=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),r=step0/mag,step=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,ticks=[];
  for(let v=lo;v<=hi+step*1e-6;v+=step)ticks.push(Math.round(v*1e6)/1e6);
  return {lo,hi,ticks};
}
const tipAttr=h=>` data-tip="${esc(h)}"`;
const tipRow=(color,name,val)=>`<div><i style="background:${color}"></i>${esc(name)}: <b style="display:inline">${val}</b></div>`;

function lineChart(w,o){
  const h=o.h||280,L=54,R=10,PT=10,B=26,W=w-L-R,H=h-PT-B,n=o.xs.length;
  let mn=Infinity,mx=-Infinity;
  o.series.forEach(s=>s.vals.forEach(v=>{if(v!=null){mn=Math.min(mn,v);mx=Math.max(mx,v)}}));
  if(!isFinite(mn)){mn=0;mx=1}
  mn=Math.min(mn,0);const sc=niceScale(mn,mx,4);
  const X=i=>L+(n<2?W/2:i/(n-1)*W),Y=v=>PT+H-(v-sc.lo)/(sc.hi-sc.lo)*H;
  let g='';
  sc.ticks.forEach(t=>{g+=`<line x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(${t===0?'--axis':'--grid'})" stroke-width="1"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(t)}</text>`});
  const every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(W/62))));
  for(let i=0;i<n;i+=every)g+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(o.xLabel(o.xs[i]))}</text>`;
  o.series.forEach(s=>{
    let d='',seg=[];const flush=()=>{if(seg.length){d+='M'+seg.join('L');seg=[]}};
    s.vals.forEach((v,i)=>{if(v==null)flush();else seg.push(X(i).toFixed(1)+','+Y(v).toFixed(1))});flush();
    if(s.area){const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
      if(pts.length>1)g+=`<path d="M${pts[0][0]},${Y(Math.max(0,sc.lo))}L${pts.map(p=>p.join(',')).join('L')}L${pts[pts.length-1][0]},${Y(Math.max(0,sc.lo))}Z" fill="${s.color}" opacity=".10"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.sw||2}" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="5 4"':''}/>`;
  });
  const cw=n<2?W:W/(n-1);
  for(let i=0;i<n;i++){
    const rows=o.series.filter(s=>s.vals[i]!=null&&!s.hideTip).map(s=>tipRow(s.color,s.name,fmtN(s.vals[i])+' '+cur())).join('');
    const extra=o.tipExtra?o.tipExtra(i):'';
    if(!rows&&!extra)continue;
    const dots=o.series.filter(s=>s.vals[i]!=null).map(s=>`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    g+=`<g class="hov"${tipAttr(`<b>${dLong(o.xs[i])}</b>${rows}${extra}`)}><rect x="${X(i)-cw/2}" y="${PT}" width="${cw}" height="${H}" fill="transparent"/><g class="hl"><line x1="${X(i)}" x2="${X(i)}" y1="${PT}" y2="${PT+H}" stroke="var(--axis)" stroke-dasharray="3 3"/>${dots}</g></g>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`;
}
function barPath(x,y,w,h,r){r=Math.min(r,w/2,h);return h<=0?'':`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function groupedBars(w,o){
  const h=o.h||260,L=54,R=8,PT=10,B=28,W=w-L-R,H=h-PT-B,n=o.labels.length,ns=o.series.length;
  const mx=Math.max(1,...o.series.flatMap(s=>s.vals.map(v=>v||0)));const sc=niceScale(0,mx,4);
  const Y=v=>PT+H-(v-sc.lo)/(sc.hi-sc.lo)*H;let g='';
  sc.ticks.forEach(t=>{g+=`<line x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(${t===0?'--axis':'--grid'})"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(t)}</text>`});
  const gw=W/n,bw=Math.max(4,Math.min(26,(gw-10)/ns-2));
  for(let i=0;i<n;i++){
    const cx=L+gw*(i+.5),x0=cx-(ns*bw+(ns-1)*2)/2;
    let bars='';o.series.forEach((s,j)=>{const v=s.vals[i]||0;bars+=`<path d="${barPath(x0+j*(bw+2),Y(v),bw,Y(0)-Y(v),4)}" fill="${s.color}"/>`});
    const rows=o.series.map(s=>tipRow(s.color,s.name,fmtN(s.vals[i]||0)+' '+cur())).join('');
    g+=`<g class="hov"${tipAttr(`<b>${esc(o.labels[i])}</b>${rows}${o.tipExtra?o.tipExtra(i):''}`)}><rect class="hl" x="${L+gw*i+2}" y="${PT}" width="${gw-4}" height="${H}" fill="var(--hover)" rx="6"/>${bars}<rect x="${L+gw*i}" y="${PT}" width="${gw}" height="${H+B}" fill="transparent"/><text x="${cx}" y="${h-8}" text-anchor="middle" font-size="11.5" fill="var(--ink2)">${esc(o.labels[i])}</text></g>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`;
}
function spark(vals,color,w=96,h=30){
  const v=vals.filter(x=>x!=null);if(v.length<2)return '';
  const mn=Math.min(...v,0),mx=Math.max(...v);const X=i=>i/(vals.length-1)*w,Y=x=>h-2-(x-mn)/((mx-mn)||1)*(h-4);

function donut(items,size=170,center=''){

/* ---------- التحليل الذكي ---------- */
function insights(pi){
  if(!pi.recs.length)return empty(T("مفيش بيانات كفاية للتحليل"),T("اختار فترة فيها بيانات."));
  const ins=buildInsights(pi),a=pi.a,ref=refDate();
  let h=`<div class="grid"><div class="card c7"><h3>${ic('bulb')} ${T("الملاحظات الذكية —")} ${esc(pi.label)}</h3><div class="sub">${T("بتتحدث أوتوماتيك مع كل رقم بتسجله")}</div><div class="ins">${ins.map(insHtml).join('')}</div></div>`;
  // توقع: باقي الشهر (لو ناقص) + الشهر الجاي كامل
  const last=RECS[RECS.length-1].k,ld=parseKey(last),eom=key(new Date(ld.getFullYear(),ld.getMonth()+1,0));
  const ny=ld.getMonth()===11?ld.getFullYear()+1:ld.getFullYear(),nm=(ld.getMonth()+1)%12+1;
  const fcs=[];
  if(last<eom)fcs.push([`${T("باقي")} ${AR_M[ld.getMonth()]} (${diffDays(last,eom)} ${LANG==="en"?"days)":T("يوم)")}`,forecastRange(addDays(last,1),eom)]);
  fcs.push([mLabel(ny,nm),forecastRange(`${ny}-${pad(nm)}-01`,`${ny}-${pad(nm)}-${pad(dim(ny,nm))}`)]);
  const fcBlock=([lbl,fs])=>{
    if(!fs)return `<div class="sub">${T("محتاج على الأقل أسبوع بيانات عشان أتوقع.")}</div>`;
    return `<div style="font-weight:700;margin:10px 0 6px">${esc(lbl)}</div><div class="sumbar" style="grid-template-columns:1fr 1fr 1fr"><div><small>${T("الإيراد")}</small><b>${fmtN(fs.inc)}</b><small><bdi class="n">${fmtN(fs.incLo)} – ${fmtN(fs.incHi)}</bdi></small></div><div><small>${T("المدفوعات")}</small><b>${fmtN(fs.exp)}</b><small>${T("بنسبة")} ${pctTxt(fs.ratio,0)}</small></div><div><small>${T("الصافي")}</small><b class="${fs.net>=0?'pos':'neg'}">${fmtN(fs.net)}</b><small><bdi class="n">${fmtN(fs.netLo)} – ${fmtN(fs.netHi)}</bdi></small></div></div>${fs.seasUsed?`<div class="note" style="margin-top:8px">${ic('cal',14)} ${T("معدّل بموسمية السنة اللي فاتت (نفس الفترة كانت")} ${fs.seas>=1?T("أقوى"):T("أضعف")} ${T("بمعامل ×")}${fs.seas.toFixed(2)}).</div>`:''}`};
  const fs0=fcs[fcs.length-1][1];
  h+=`<div class="card c5"><h3>${ic('up')} ${T("التوقعات")}</h3><div class="sub">${T("بناءً على متوسط آخر 60 يوم مسجل مع مراعاة قوة كل يوم في الأسبوع، ونطاق محتمل 80%")}</div>${fcs.map(fcBlock).join('')}${fs0?`<div class="note" style="margin-top:10px"><b>${T("درجة الثقة:")} ${fs0.conf.txt}</b> — ${fs0.conf.why}. ${fs0.conf.lvl<2?T("التوقع مبدئي وهيبقى أدق كل ما تسجل شهور أكتر (خصوصًا لو فيه موسمية زي مواسم الدواجن)."):''}</div>`:''}</div>`;
  // دفعات متوقعة
  const up=DB.cats.filter(c=>c.on&&c.type==='sup').map(c=>({c,r:payRhythm(c.id)})).filter(x=>x.r.next&&x.r.n>=2).sort((x,y)=>x.r.next.localeCompare(y.r.next));
  const win=up.filter(x=>diffDays(ref,x.r.next)<=14),tot=sum(win.map(x=>x.r.typ));
  h+=`<div class="card c7"><h3>${ic('clock')} ${T("الدفعات المتوقعة للشركات")}</h3><div class="sub">${T("من إيقاع دفعك السابق لكل شركة (المرجع: آخر يوم مسجل")} ${dShort(ref)}) — ${win.length?`${T("أول 14 يوم متوقع")} <b>${fmtN(tot)} ${cur()}</b> ${T("تقريبًا")}`:T("مفيش دفعات متوقعة قريب")}</div>
   <div class="tw" style="max-height:340px"><table class="t"><thead><tr><th>${T("الشركة")}</th><th>${T("آخر دفعة")}</th><th>${T("كل كام يوم")}</th><th>${T("المتوقعة")}</th><th>${T("المبلغ المعتاد")}</th></tr></thead><tbody>${up.map(x=>{const od=diffDays(x.r.last,ref)>x.r.gap*DB.settings.overdue&&x.r.n>=3;return `<tr class="clk" data-act="cat" data-c="${x.c.id}"><td>${esc(x.c.name)} ${od?('<span class='+'"'+'pill warn'+'"'+'>'+T("متأخر")+'</span>'):''}</td><td>${dShort(x.r.last)}</td><td>${Math.round(x.r.gap)}</td><td>${dShort(x.r.next)}</td><td>${N(x.r.typ)}</td></tr>`}).join('')||('<tr>'+'<td colspan='+'"'+'5'+'"'+' class='+'"'+'muted'+'"'+' style='+'"'+'text-align:center;padding:20px'+'"'+'>'+T("لسه محتاج دفعتين لكل شركة")+'</td>'+'</tr>')}</tbody></table></div></div>`;
  // محاكي
  h+=`<div class="card c5" id="simCard">${simHtml(pi)}</div>`;
  // ايام الأسبوع
  h+=`<div class="card c6"><h3>${T("نمط الأسبوع")}</h3><div class="sub">${T("أي يوم بيجيب أكتر؟ (متوسط الإيراد لكل يوم)")}</div>${weekdayChart(pi.recs)}</div>`;
  const rs=pi.recs.filter(r=>r.inc>0);const buckets=[[0,.5],[.5,.8],[.8,1.2],[1.2,1.6],[1.6,99]];
  const lbl=[T("ضعيف جدًا"),T("أقل من المعتاد"),T("معتاد"),T("أعلى من المعتاد"),T("قوي جدًا")];
  const cnt=buckets.map(([lo,hi])=>rs.filter(r=>r.inc/a.avgInc>=lo&&r.inc/a.avgInc<hi).length);
  h+=`<div class="card c6"><h3>${T("توزيع الأيام حسب قوة البيع")}</h3><div class="sub">${T("مقارنة بمتوسط اليوم (")}${fmtN(a.avgInc)} ${cur()})</div><div class="hb">${buckets.map((b,i)=>`<div class="hbr" style="cursor:default;grid-template-columns:110px 1fr 40px"><div class="nm">${lbl[i]}</div><div class="tr"><div class="fl" style="width:${cnt[i]/Math.max(1,...cnt)*100}%;background:var(--c1)"></div></div><div class="vl">${cnt[i]}</div></div>`).join('')}</div></div>`;
  // موسمية شهرية عبر كل البيانات
  const bm={};RECS.forEach(r=>{const m=+r.k.slice(5,7),ym=ymOf(r.k);(bm[m]=bm[m]||{})[ym]=(bm[m][ym]||[]).concat(r)});
  const ms=Object.keys(bm).map(Number).sort((x,y)=>x-y).filter(m=>Object.values(bm[m]).some(a=>a.length>=10));
  if(ms.length>=6){
    const vals=ms.map(m=>{const ar=Object.values(bm[m]).filter(a=>a.length>=10).map(a=>mean(a.map(r=>r.inc)));return mean(ar)});
    const ns=ms.map(m=>Object.values(bm[m]).filter(a=>a.length>=10).length);
    h+=`<div class="card c12"><h3>${ic('cal')} ${T("الموسمية: متوسط البيع اليومي حسب شهور السنة")}</h3><div class="sub">${T("متوسط كل شهر عبر كل السنين المسجلة — بيوضح شهورك القوية والضعيفة")}${ms.length<12?(' '+T("(لسه ناقص شهور)")):''}</div>${slot('seas',w=>groupedBars(w,{labels:ms.map(m=>AR_M[m-1]),series:[{name:T("متوسط البيع اليومي"),color:'var(--c1)',vals}],tipExtra:i=>`<div style="opacity:.8;margin-top:3px">${T("مبني على")} ${ns[i]} ${ns[i]>1?T("سنين/مرات"):T("سنة")}</div>`,h:230}),230)}</div>`;
  }
  return h+`</div>`;
}
function simOut(pi){
  const a=pi.a,s=S.sim,inc=a.inc*(1+s.i/100),sup=a.sup*(1+s.s/100),op=a.op*(1+s.o/100),net=inc-sup-op,d=net-a.net;
  return `<div class="sumbar" style="margin-top:14px;grid-template-columns:1fr 1fr"><div><small>${T("الصافي الجديد")}</small><b class="${net>=0?'pos':'neg'}">${M(net)}</b></div><div><small>${T("الفرق عن الفعلي")}</small><b class="${d>=0?'pos':'neg'}">${d>0?'+':''}${M(d)}</b></div></div>
  <div class="note" style="margin-top:10px">${T("الهامش يبقى")} <b>${pctTxt(inc?net/inc:0,1)}</b> ${T("بدل")} ${pctTxt(a.margin,1)}. ${s.i||s.s||s.o?`<a href="#" data-act="simreset" style="color:var(--brand)">${T("إعادة ضبط")}</a>`:''}</div>`;
}
function simHtml(pi){
  const s=S.sim;
  const sl=(k,lbl,mn,mx)=>`<div><div class="r"><span>${lbl}</span><b class="n" data-lbl="${k}">${s[k]>0?'+':''}${s[k]}%</b></div><input class="sl" type="range" min="${mn}" max="${mx}" step="1" value="${s[k]}" data-act="sim" data-k="${k}"></div>`;
  return `<h3>${ic('zap')} ${T("جرّب \"لو…\"")}</h3><div class="sub">${T("حرّك المؤشرات وشوف الأثر على")} ${esc(pi.label)}</div><div style="display:flex;flex-direction:column;gap:12px">${sl('i',T("لو المبيعات اتغيرت"),-30,50)}${sl('s',T("لو مدفوعات الشركات اتغيرت"),-30,30)}${sl('o',T("لو مصروفات التشغيل اتغيرت"),-30,30)}</div><div id="simOut">${simOut(pi)}</div>`;
}

let PENDING=null;
function editCell(td){
  if(td.querySelector('input'))return;
  const k=td.dataset.k,c=td.dataset.c,r=RM[k];const cur_=c==='__inc'?(r?r.inc:0):(r?.e[c]||0);
  td.innerHTML=`<input value="${cur_||''}" inputmode="decimal" autocomplete="off">`;const i=td.firstChild;i.focus();i.select();
  let done=false;
  const commitCell=(mv)=>{
    if(done)return;done=true;const v=parseNum(i.value);
    if(v!==cur_){commit(()=>{const d=DB.days[k]||(DB.days[k]={i:0,e:{}});if(c==='__inc')d.i=v;else{if(v>0)d.e[c]=v;else{delete d.e[c];if(d.p){delete d.p[c];if(!Object.keys(d.p).length)delete d.p}}}})}
    else render();
    if(mv)PENDING=mv;post();
  };
  i.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const nk=addDays(k,e.shiftKey?-1:1);commitCell({k:nk,c})}
    else if(e.key==='Tab'){e.preventDefault();const sib=e.shiftKey?td.previousElementSibling:td.nextElementSibling;
      if(sib&&sib.classList.contains('cell'))commitCell({k,c:sib.dataset.c});else commitCell(null)}
    else if(e.key==='Escape'){done=true;render()}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();commitCell({k:addDays(k,e.key==='ArrowDown'?1:-1),c})}
  });
  i.addEventListener('blur',()=>setTimeout(()=>commitCell(null),0));
}
function post(){if(S.page==='settings')settingsAsync();if(PENDING){const p=PENDING;PENDING=null;const td=$(`td.cell[data-k="${p.k}"][data-c="${p.c}"]`);if(td){editCell(td);td.scrollIntoView({block:'nearest'})}}}
{const _r=render;render=function(){_r();post()}}

/* ---------- كاتب / قارئ XLSX (بدون مكتبات) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{const nb=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,0,true);lh.setUint16(12,33,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nb.length,true);

function parseTemplate(sheets){

  const sales=sheets.find(s=>/sales/i.test(s.name))||sheets.find(s=>s!==comp);
  if(!comp)throw new Error(T("مش لاقي شيت الشركات (companies) في الملف"));

    let n=norm(nm);if(n==='تاميانات')n=norm('تأمينات');
    if(n===norm('اخري')){const want=occ===0?'أخرى (موردين)':'أخرى (تشغيل)';const c=DB.cats.find(c=>c.name===want);if(c)return c.id}
    const c=DB.cats.find(c=>norm(c.name)===n)||newCats.find(c=>norm(c.name)===n);if(c)return c.id;
    const nc={id:'c'+Date.now().toString(36)+newCats.length,name:nm.trim(),type:'sup',on:1};newCats.push(nc);return nc.id};
  const days={},get=k=>days[k]||(days[k]={i:0,e:{}});
  let cols=null,occ={};
  comp.rows.forEach(r=>{if(!r)return;
    if(typeof r[0]==='string'&&r[0].toUpperCase().includes('DAY/COMPANY')){cols={};occ={};for(let c=1;c<r.length;c++){const nm=r[c];if(typeof nm==='string'&&nm.trim()&&!/total/i.test(nm)){const nn=norm(nm);const o=occ[nn]=(occ[nn]??-1)+1;cols[c]=mapName(nm,o)}}return}

  });

  openModal(`<div class="modal"><div class="mh"><h2>${T("شركة / بند جديد")}</h2><button class="btn iconbtn ghost" data-act="close">${ic('x')}</button></div><div class="mb"><div class="fld"><label>${T("الاسم")}</label><input class="inp" id="ncName" autofocus></div><div class="fld"><label>${T("النوع")}</label><div class="seg"><button class="on" data-act="nctype" data-t="sup">${T("شركة / مورد")}</button><button data-act="nctype" data-t="op">${T("مصروف تشغيل")}</button></div></div></div><div class="mf"><button class="btn pri" data-act="ncsave">${ic('save')} ${T("إضافة")}</button></div></div>`);
  setTimeout(()=>$('#ncName')?.focus(),50);
}

/* ====================== الأحداث ====================== */
const CLICK={
  nav:d=>{S.page=d.p;render();scrollTo(0,0)},
  pp:d=>{shiftPeriod(+d.d);render()},
  new:()=>openEditor(),
  edit:d=>openEditor(d.k),
  mode:d=>{S.mode=d.m;render()},
  gomonth:d=>{PER={mode:'month',y:+d.y,m:+d.m};render()},
  cat:d=>openCat(d.c),
  ledf:d=>{S.ledF=d.f;render()},
  supt:d=>{S.supT=d.t;render()},
  simreset:e=>{S.sim={i:0,s:0,o:0};render()},
  settarget:()=>{const v=parseNum($('#tgtIn').value);if(!v)return toast(T("اكتب رقم الهدف"));DB.settings.target=v;persist();render();toast(T("تم حفظ الهدف ✔"))},
  settarget2:()=>{const v=prompt(T("هدف الإيراد الشهري:"),DB.settings.target);if(v!==null){DB.settings.target=parseNum(v);persist();render()}},
  backup,restore:restoreBackup,import:openImport,
  xlsx:d=>exportXlsx(d.s),print:()=>print(),
  reseed:async()=>{if(confirm(T("هيتم استبدال كل بياناتك ببيانات ملف sales2026 الأصلي (يناير 2026). متأكد؟"))){if(!await safeSnap(T("قبل استرجاع بيانات الإكسل")))return;commit(()=>{const s=DB.settings;DB=sanitize(JSON.parse(JSON.stringify(SEED)));DB.settings=s},T("تم استرجاع بيانات الإكسل"));initPeriod();render()}},
  wipe:async()=>{if(confirm(T("هيتم مسح كل الأيام المسجلة (الشركات هتفضل). البرنامج هياخد نسخة تلقائية قبل المسح تقدر ترجعلها من الإعدادات. متأكد؟"))){if(!await safeSnap(T("قبل مسح كل البيانات")))return;commit(()=>{DB.days={}},T("تم المسح — تقدر تتراجع"));initPeriod();render()}},
  theme:toggleTheme,
  lang:()=>setLang(LANG==='en'?'ar':'en'),setlang:d=>{if(d.l!==LANG)setLang(d.l)},
  settheme:d=>{DB.settings.theme=d.t;persist();render()},
  savesettings:()=>{const s=DB.settings;s.shop=$('#setShop').value.trim()||'VetCare';s.cur=$('#setCur').value.trim()||'ج.م';s.target=parseNum($('#setTgt').value);s.overdue=+$('#setOver').value;persist();render();toast(T("تم حفظ الإعدادات ✔"))},
  addcat:addCatModal,
  nctype:d=>{$$('.modal .seg button').forEach(b=>b.classList.toggle('on',b===d._el))},
  ncsave:()=>{const n=$('#ncName').value.trim();if(!n)return toast(T("اكتب الاسم"));if(DB.cats.some(c=>norm(c.name)===norm(n)))return toast(T("الاسم ده موجود بالفعل"));
    const t=$('.modal .seg button.on').dataset.t;commit(()=>DB.cats.push({id:'c'+Date.now().toString(36),name:n,type:t,on:1}),T("تمت الإضافة ✔"));closeModal()},
  savecat:d=>{const c=CM[d.c],n=$('#catName').value.trim();if(!n)return toast(T("الاسم مطلوب"));if(DB.cats.some(x=>x.id!==c.id&&norm(x.name)===norm(n)))return toast(T("الاسم ده موجود بالفعل"));
    commit(()=>{const x=DB.cats.find(y=>y.id===d.c);x.name=n;x.type=$('#catType').value;x.on=$('#catOn').checked?1:0},T("تم حفظ التعديلات ✔"));closeModal()},
  delcat:d=>{const used=RECS.some(r=>r.e[d.c]);
    if(used){if(confirm(T("الشركة دي عليها دفعات مسجلة، فمش هتتحذف — هتتأرشف (بتختفي من التسجيل وبياناتها تفضل). تأرشف؟")))commit(()=>{DB.cats.find(y=>y.id===d.c).on=0},T("تمت الأرشفة"));closeModal()}
    else if(confirm(T("حذف نهائي؟")))commit(()=>{DB.cats=DB.cats.filter(y=>y.id!==d.c)},T("تم الحذف"));closeModal()},
  palette:openPalette,close:()=>closeModal(),undo,
  edchip:d=>edAddRow(d.c),
  edremove:d=>{ED.rows.splice(+d.i,1);$('#edRows').innerHTML=edRows();$('#edChips').innerHTML=edChips();edRefresh()},
  edsave:()=>edSave(false),edsavenext:()=>edSave(true),
  eddel:()=>{if(confirm((T("حذف تسجيل")+' ')+dShort(ED.k)+T("؟"))){const k=ED.k;commit(()=>{delete DB.days[k]},T("تم حذف اليوم"));closeModal()}},
  edday:d=>edLoadDate(addDays(ED.k,+d.d)),
  iosdismiss:()=>{try{localStorage.setItem('vetcare_ios_hint','1')}catch(e){}render()},
  fslink:fsLink,fsperm:fsPerm,fsunlink:fsUnlink,
  dismissErr:()=>{LOAD_ERR=null;render()},
  health:openHealth,
  snaprestore:async d=>{const r=await IDB.get('snaps',d.id);if(!r)return toast(T("النسخة مش موجودة"));
    if(!confirm(`${T("هيتم استبدال بياناتك الحالية بنسخة")} ${new Date(r.ts).toLocaleString(LANG==='en'?'en-US':'ar-EG-u-nu-latn')} (${r.days} ${T("يوم). الحالية هتتحفظ كنسخة قبل الاسترجاع. متأكد؟")}`))return;
    if(!await safeSnap(T("قبل الاسترجاع من نسخة تلقائية")))return;commit(()=>{DB=sanitize(JSON.parse(r.data))},T("تم الاسترجاع ✔"));initPeriod();render()},
  snapdl:async d=>{const r=await IDB.get('snaps',d.id);if(r)download(`vetcare-snapshot-${key(new Date(r.ts))}.json`,new Blob([r.data],{type:'application/json'}))},
  mergecat:d=>{const t=$('#mergeTo').value;if(!t)return toast(T("اختار الشركة الأساسية الأول"));const a=CM[d.c],b=CM[t];
    if(!confirm(`${T("هيتم نقل كل دفعات «")}${a.name}${T("» إلى «")}${b.name}${T("» وحذف «")}${a.name}${T("». متأكد؟")}`))return;
    commit(()=>{Object.values(DB.days).forEach(x=>{if(x.e[d.c]){x.e[t]=(x.e[t]||0)+x.e[d.c];delete x.e[d.c]}if(x.p&&x.p[d.c]){x.p[t]=(x.p[t]||[]).concat(x.p[d.c]);delete x.p[d.c]}});DB.cats=DB.cats.filter(x=>x.id!==d.c)},`${T("تم دمج")} ${a.name} ${T("في")} ${b.name} ✔`);closeModal()},
  saveretry:()=>{const ok=persist();if(ok)toast(T("تم الحفظ ✔"))},cflnew:()=>cflResolve(true),cflmine:()=>cflResolve(false),
  checkbk:()=>pickFile('.json,application/json',async f=>{try{openModal(backupReportHtml(checkBackup(JSON.parse(await f.text())),(T("فحص:")+' ')+f.name))}catch(e){openModal(backupReportHtml({ok:false,errors:[(T("الملف مش JSON صالح أو تالف:")+' ')+(e.message||e)],warnings:[],info:[],days:0,cats:0,payments:0,refs:0,photos:0},(T("فحص:")+' ')+f.name))}}),
  installpwa:async()=>{if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice}catch(e){}DEFERRED=null;render()},
  phadd:d=>phPick(d.i),phcam:d=>phPick(d.i,1),pvopen:pvOpen2,
  phrm:d=>{const r=ED.rows[+d.i];if(r){r.ph=(r.ph||[]).filter(x=>x!==d.p);$('#edRows').innerHTML=edRows();edRefresh()}},
  phview:d=>pvOpen(d.ids.split(','),+d.i||0),
  pvclose:pvClose,pvsave:pvSave,
  pvnext:d=>{if(PV){PV.i=(PV.i+ +d.d+PV.ids.length)%PV.ids.length;pvShow()}},
  backupfull:backupFull,
  impfile:()=>pickFile('.xlsx',handleImportFile),impgo:doImport,
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){const a=t.dataset.act;if(t.tagName==='SELECT'||t.tagName==='INPUT')return;
    if(a==='backup'||a==='settarget2'||a==='simreset')e.preventDefault();
    if(CLICK[a]){CLICK[a]({...t.dataset,_el:t},e);return}}
  const td=e.target.closest('td.cell');if(td&&S.page==='matrix')editCell(td);
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='psel'){const v=t.value;if(v==='all')PER={mode:'all'};else if(v[0]==='y')PER={mode:'year',y:+v.slice(2)};else{const [y,m]=v.slice(2).split('-').map(Number);PER={mode:'month',y,m}}render()}
  else if(a==='supsort'){S.supSort=t.value;render()}
  else if(a==='mxall'){S.mxAll=t.checked;render()}
  else if(a==='impsel'){IMP.sel[+t.dataset.i]=t.checked}
  else if(a==='impmode'){IMP.mode=t.value}
  else if(t.id==='edDate'&&ED&&t.value){edLoadDate(t.value)}
  else if((t.id==='phIn'||t.id==='phCam')&&ED){phFiles([...t.files])}
});
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.id==='ledQ'){S.ledQ=t.value;$('#ledBody').innerHTML=ledgerRows(periodInfo())}
  else if(t.id==='supQ'){S.supQ=t.value;$('#main').innerHTML=suppliers(periodInfo());const q=$('#supQ');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  else if(a==='sim'){S.sim[t.dataset.k]=+t.value;const pi=periodInfo();$('#simOut').innerHTML=simOut(pi);$(`[data-lbl="${t.dataset.k}"]`).textContent=(S.sim[t.dataset.k]>0?'+':'')+S.sim[t.dataset.k]+'%'}
  else if(ED){
    if(t.id==='edInc'){ED.inc=t.value;edRefresh()}
    else if(t.classList.contains('edAmt')){ED.rows[+t.dataset.i].v=t.value;edRefresh()}
    else if(t.id==='edNote')ED.note=t.value;
    else if(t.id==='edQ'){ED.q=t.value;$('#edChips').innerHTML=edChips()}
  }
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(PV){if(e.key==='Escape'){pvClose();return}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){CLICK.pvnext({d:(e.key==='ArrowLeft')===(LANG!=='en')?1:-1});return}}
  if(e.key==='Escape'){if($('.pal'))return;if($('#mbg'))closeModal();return}
  if(ED){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();edSave(e.shiftKey);return}
    if(e.key==='Enter'&&!e.isComposing){
      if(e.target.id==='edInc'){e.preventDefault();$('#edQ').focus()}
      else if(e.target.classList.contains('edAmt')){e.preventDefault();$('#edQ').focus();$('#edQ').select()}
      else if(e.target.id==='edQ'){e.preventDefault();const q=norm(ED.q);const c=DB.cats.filter(c=>c.on&&(!q||norm(c.name).includes(q))).sort((a,b)=>{const u=usageCount();return (u[b.id]||0)-(u[a.id]||0)});
        const pick=c.find(x=>!ED.rows.find(r=>r.c===x.id))||c[0];if(pick){ED.q='';e.target.value='';edAddRow(pick.id)}else if(!q)edSave(false)}
    }
    return;
  }
  if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='n'||e.key==='N'||e.key==='ن'){if(!$('#mbg')){e.preventDefault();openEditor()}}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,120)});
document.addEventListener('dragover',e=>e.preventDefault());

try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.filter(k=>/^vetcare-/.test(k)).forEach(k=>caches.delete(k))).catch(()=>{})}}catch(e){}
